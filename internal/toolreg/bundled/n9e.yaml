# 夜莺（n9e）MCP 工具的元数据。
#
# 为什么需要这个文件：MCP 服务器只报告工具名和描述，不报告"这个工具产出什么类型
# 的证据"。没有它，任务中心只能说"执行工具"——那是诚实的，但对人没用。
# 声明之后，同一批调用会被归成"查询监控""关联日志"这样的业务阶段。
#
# 这个文件编译进二进制（internal/toolreg/bundled.go），所以不需要任何启用步骤。
# 它以前在 configs/tools/ 下、要靠 tools.metadata_dir 指过来才生效——而没人设过
# 那个键，容器镜像里也根本没有 configs/，于是这些声明从来没有生效过：六个 n9e
# 工具一直在没有 produces、没有 side_effect、没有 suites 的状态下运行。
#
# server 必须与 mcp 段里的服务器名一致，否则不会匹配上。名字对不上的条目是惰性的
# ——没有那个 MCP 服务器的部署不受影响，这也是可以随产品发布它的原因。
#
# 这里**不写 backend**。Registry.Available 按 backend 过滤，而目前唯一构造的
# incident（engine.incidentFor）不带 targets，Backends() 返回空——所以任何带
# backend 的工具在每一条路径上都会被滤掉，包括提示词页面自己。
# internal/server 里 TestAConsoleDeclarationDoesNotSetABackend 守着同一件事。
#
# 你自己部署的声明放 tools.metadata_dir 指向的目录；控制台改的存进 tool_decls。

tools:
  # ── 监控指标：任务中心归为「查询监控」 ────────────────────────────
  - name: query_instant
    server: n9e-mcp
    description: 对监控数据源执行一次 PromQL 瞬时查询。
    produces: metric_series
    side_effect: read_only
    idempotent: true
    parallel_safe: true
    latency: fast

  - name: query_range
    server: n9e-mcp
    description: 对监控数据源执行 PromQL 区间查询，返回时间序列。
    produces: metric_series
    side_effect: read_only
    idempotent: true
    parallel_safe: true
    latency: medium

  # ── 告警：归为「查询事件」 ────────────────────────────────────────
  - name: list_active_alerts
    server: n9e-mcp
    description: 列出当前活跃告警。
    produces: events
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_history_alerts
    server: n9e-mcp
    description: 列出历史告警记录。
    produces: events
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  # ── 配置类：归为「读取配置」 ──────────────────────────────────────
  - name: list_alert_rules
    server: n9e-mcp
    description: 列出告警规则。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_busi_groups
    server: n9e-mcp
    description: 列出业务组。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_datasources
    server: n9e-mcp
    description: 列出监控数据源。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_dashboards
    server: n9e-mcp
    description: 列出监控大盘。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: get_dashboard_pure
    server: n9e-mcp
    description: 读取单个大盘的完整配置。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  # ── 资源清单：归为「查询状态」 ────────────────────────────────────
  - name: list_targets
    server: n9e-mcp
    description: 列出被监控对象。
    produces: workload_status
    side_effect: read_only
    idempotent: true
    parallel_safe: true
