services:
  postgres:
    image: postgres:16-bookworm
    container_name: jelly-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jelly}
      POSTGRES_USER: ${POSTGRES_USER:-jelly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jelly-dev}
      TZ: Asia/Shanghai
    volumes:
      - ./.data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
