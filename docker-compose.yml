# 应用本身。可观测后端在 obs profile、PostgreSQL 在 db profile，默认都不启动。
#
#   docker compose up -d                    只跑 agent（连你已有的 collector）
#   docker compose --profile obs up -d      顺带起一套本地的 traces/metrics/logs
#   docker compose --profile db  up -d      连 PostgreSQL 一起起
#
# 默认不带 db profile 时，状态落在 ./data/.jelly-agent/state.db —— 单进程够用。
# 要换成 PostgreSQL（多进程共享、能备份能接从库）：
#
#   1. docker compose --profile db up -d postgres     # 首次启动会跑建表脚本
#   2. 下面的 JELLY_STORAGE_DSN 就够了 —— 配置文件里没有 storage 段时，它会被
#      当成状态库。挂进去的配置写了 storage.dsn 的话，以文件为准。
#   3. 已经有数据要搬的话，停掉 agent 再搬，然后重启：
#          docker compose run --rm jelly-agent migrate --from /data/.jelly-agent/state.db
#
# 没有给 jelly-agent 加 depends_on：那会把 db profile 连带拉起来，而默认就该是
# 单机 SQLite。库晚一点起来也没关系 —— 打开失败不会被记住，下一次调用重试，
# 工具声明那一层也会自己补载。
services:
  jelly-agent:
    image: jelly-agent:local
    user: "0:0"
    ports:
      - "6185:6185"
    volumes:
      - ./data:/data
    environment:
      # config.yaml 里的 ${OTEL_ENDPOINT} 会被展开成这个值，所以同一份配置
      # 在宿主机上指向你的 collector、在 compose 里指向下面那个容器，不用改文件。
      # 详见 tracing.endpoint 的写法（docs/observability.md）。
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-lgtm:4317}
      # 状态库。配置文件里没有 storage 段时就用这个值，不用先去挂载卷里手写一段
      # YAML —— 容器恰恰是最不方便改自己配置的那个场景。文件里写了就以文件为准。
      # 两边都没有，才是 ./data/.jelly-agent/state.db。
      #
      # 下面这个默认值指向本文件里的 postgres 服务。**只抄 jelly-agent 这一段
      # 到别处时它解析不了**（那台机器上没有叫 postgres 的主机），要在 shell 里
      # 导出真正的 DSN，或者直接把这一行的值换掉。
      #
      # 名字不叫 JELLY_PG_DSN：那个是测试用的，而 PG 上的测试会把每张表清空。
      # 两者共用一个变量名，迟早有人把测试跑在生产库上 —— 这不是假设，是已经
      # 发生过一次的事。
      #
      # 口令写在环境里而不是配置文件里，是因为配置文件要进备份、可能被贴进工单；
      # 线上请走你们自己的密钥管理，别用这里的开发口令。
      JELLY_STORAGE_DSN: ${JELLY_STORAGE_DSN:-postgres://jelly:jelly-dev@postgres:5432/jelly?sslmode=disable}
    restart: unless-stopped

  # traces + metrics + logs 一个容器搞定：Tempo / Prometheus / Loki + Grafana。
  #
  # 选它而不是 Jaeger all-in-one，是因为 tracing.capture_content 打开后，
  # 提示词与回复是走 OTel 的 *logs* 通道发出去的（gen_ai.system.message /
  # gen_ai.choice），后端没有 logs pipeline 就会拒收，表现为 stderr 上不断
  # 重试的导出错误。Jaeger 只收 traces。
  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["obs"]
    ports:
      - "3000:3000"   # Grafana，数据源已预置好
      - "4317:4317"   # OTLP gRPC —— tracing.protocol: grpc 对应这个
      - "4318:4318"   # OTLP HTTP —— tracing.protocol: http 对应这个
    volumes:
      - ./data/lgtm:/data
    restart: unless-stopped

  # PostgreSQL —— 换掉 SQLite 的那一个（migrations/README.md）。
  #
  # 版本钉死不用 latest：数据库大版本升级要 pg_upgrade，一个 latest 标签
  # 在某天悄悄把本地数据变成打不开的状态，不值得省这点事。
  #
  # pg_trgm 在 contrib 里，官方镜像自带，不用装插件 —— 这正是选 PG 而不是
  # 引一套 ES 的理由之一。
  postgres:
    image: postgres:16-bookworm
    profiles: ["db"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jelly
      # 开发用的口令，别拿去线上。线上走你们自己的实例和密钥管理。
      POSTGRES_USER: ${PGUSER:-jelly}
      POSTGRES_PASSWORD: ${PGPASSWORD:-jelly-dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # 时间一律按 UTC 存，容器时区不能让语义漂移（见 migrations/README.md）。
      TZ: UTC
      PGTZ: UTC
    volumes:
      # 命名卷而不是 ./data 下的 bind mount：PG 要求数据目录 0700 且属主一致，
      # 而 macOS 的 Docker Desktop 在 bind mount 上既给不了稳定的属主也慢。
      # 另外 ./data 整个挂进了 jelly-agent 容器，PG 的数据文件不该出现在那里。
      - postgres-data:/var/lib/postgresql/data
      # 首次启动时，这个目录里的 *.sql 会按文件名顺序自动跑一遍。
      #
      # 只在数据目录为空时执行。改了 schema 要重来：
      #     docker compose --profile db down -v
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready 只说进程在听，所以顺带查一下建表脚本真的跑完了 ——
      # 初始化失败时容器仍然是 running，光看 pg_isready 发现不了。
      #
      # 用户名走 compose 层替换（和上面 POSTGRES_USER 同一个表达式），不用
      # $$ 转义把变量留给容器里的 shell —— 那样读的人得先想清楚是谁在展开。
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-jelly} -d jelly && psql -U ${PGUSER:-jelly} -d jelly -tAc \"SELECT to_regclass('public.tool_results') IS NOT NULL\" | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
