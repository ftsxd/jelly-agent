# jelly-agent 配置示例。
# 复制为 configs/config.yaml（或 ~/.jelly-agent/config.yaml）后按需修改。
# api_key 支持 ${ENV} 语法，从环境变量读取，避免明文入库。
#
# 若不创建 config.yaml，CLI 会回落到 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL 环境变量。

default_provider: deepseek

providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat

  - name: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o

  - name: claude
    base_url: https://api.anthropic.com/v1
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6

  - name: ollama
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: llama3.3
