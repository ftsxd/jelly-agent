# jelly-agent 配置示例。
# 复制为 configs/config.yaml（或 ~/.jelly-agent/config.yaml）后按需修改。
# api_key 支持 ${ENV} 语法，从环境变量读取，避免明文入库。
#
# 若不创建 config.yaml，CLI 会回落到 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL 环境变量。

default_provider: deepseek

providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat

  - name: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o

  - name: claude
    base_url: https://api.anthropic.com/v1
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6

  - name: ollama
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: llama3.3

# 记忆系统（可选）。整段省略即用默认值。
memory:
  # L1 核心记忆：MEMORY.md / USER.md 每轮注入 system prompt。
  # 默认 dir=~/.jelly-agent/memory，预算 800/500 token。
  core:
    dir: ~/.jelly-agent/memory
    memory_budget_tokens: 800   # MEMORY.md（代理长期笔记）硬上限
    user_budget_tokens: 500     # USER.md（用户画像）硬上限
  # L2 会话检索：把历史会话文本索引进 SQLite FTS5（与 state.db 同库），
  # 开启后 Agent 获得 load_memory 工具按需检索。默认关闭。
  search:
    enabled: false
    backend: fts5               # 目前仅 fts5；向量后端属 L3（后续）
    top_k: 5                    # 每次检索返回的最大条数
    summarize: false            # 预留：检索结果经模型压缩（尚未接线）
