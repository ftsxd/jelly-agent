# jelly-agent 配置示例。
# 复制为 configs/config.yaml（或 ~/.jelly-agent/config.yaml）后按需修改。
# api_key 支持 ${ENV} 语法，从环境变量读取，避免明文入库。
#
# 若不创建 config.yaml，CLI 会回落到 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL 环境变量。

default_provider: deepseek

# Web 控制台管理员。首次执行 jelly serve 时会自动创建 admin、输出一次性
# 初始密码，并在此处写入 bcrypt 哈希。首次登录后必须修改密码；不要手填明文。
# web:
#   admin:
#     username: admin
#     password_hash: $2a$...  # bcrypt 哈希，由服务自动生成

providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat

  - name: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o

  - name: claude
    base_url: https://api.anthropic.com/v1
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6

  - name: ollama
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: llama3.3

# 记忆系统（可选）。整段省略即用默认值。
memory:
  # L1 核心记忆：MEMORY.md / USER.md 每轮注入 system prompt。
  # 默认 dir=~/.jelly-agent/memory，预算 800/500 token。
  core:
    dir: ~/.jelly-agent/memory
    memory_budget_tokens: 800   # MEMORY.md（代理长期笔记）硬上限
    user_budget_tokens: 500     # USER.md（用户画像）硬上限
  # L2 会话检索：把历史会话文本索引进 SQLite FTS5（与 state.db 同库），
  # 开启后 Agent 获得 load_memory 工具按需检索。默认关闭。
  search:
    enabled: false
    backend: fts5               # 目前仅 fts5；向量后端属 L3（后续）
    top_k: 5                    # 每次检索返回的最大条数
    summarize: false            # 预留：检索结果经模型压缩（尚未接线）

# 技能脚本执行（可选）。仅当信任技能时开启。
skills:
  # dir: ~/.jelly-agent/skills    # 技能目录，留空用默认
  allow_scripts: false          # 开启 run_script 工具（在沙箱中执行技能脚本）

# 沙箱：run_script（及后续 run_code）的执行隔离与资源上限。整段省略即用默认值。
# ⚠️ native 后端是“尽力而为”加固（清洗环境、限工作目录、超时杀进程组、限 CPU 时长 +
#    输出截断），不限制文件系统/网络，不是安全边界；需要强隔离请用 docker 后端。
sandbox:
  backend: ""                   # ""=自动（有 docker 且 allow_docker 时用 docker，否则 native）；可显式填 native / docker
  allow_docker: false           # 允许自动/显式选用 docker 强隔离后端
  network: false                # docker 后端是否放开网络（false=--network none；native 无法限制）
  image: python:3.12-slim       # docker 后端使用的镜像
  timeout_sec: 60               # 单次执行墙钟超时
  max_output_kb: 8              # 捕获的 stdout+stderr 上限
  cpu_seconds: 30               # native：CPU 时长上限（best-effort）
  max_procs: 64                 # docker：--pids-limit（native 无法按沙箱限制）
  memory_mb: 512                # docker：--memory（native 无法可靠限制）

# 多 Agent（可选）。整段省略即用默认单 Agent。给协调者填 sub_agents 即开启
# ADK 的 transfer_to_agent 转交：协调者按子 Agent 的 description 判断委派给谁。
# default_agent: coordinator      # 对话/消息绑定默认用哪个 Agent；留空=默认单 Agent
# agents:
#   - name: coordinator           # 标识符 [A-Za-z0-9_-]+
#     description: 总协调，按子 Agent 职责决定转交给谁   # 供上级判断何时转交
#     provider: deepseek          # 留空=默认 Provider，可让不同 Agent 跑不同模型
#     instruction: 你是协调者，先判断该由哪个专家处理，再决定是否转交。  # 留空=内置默认指令
#     sub_agents: [researcher, coder]   # 可转交的子 Agent
#     enabled: true
#   - name: researcher
#     description: 擅长联网检索与资料整理
#     mcp: [filesystem]           # 按需加载的 MCP 子集；不选=不挂 MCP
#     enabled: true
#   - name: coder
#     description: 写代码与调试
#     enabled: true
