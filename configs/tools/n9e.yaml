# 夜莺（n9e）MCP 工具的元数据。
#
# 为什么需要这个文件：MCP 服务器只报告工具名和描述，不报告"这个工具产出什么类型
# 的证据"。没有它，任务中心只能说"执行工具"——那是诚实的，但对人没用。
# 声明之后，同一批调用会被归成"查询监控""关联日志"这样的业务阶段。
#
# 这是配置，不是代码：下面的名字来自实际跑过的会话，你的 MCP 服务器换了工具，
# 改这个文件即可，不用改程序。
#
# 启用方式（config.yaml）：
#   tools:
#     metadata_dir: /path/to/configs/tools
#
# server 必须与 mcp 段里的服务器名一致，否则不会匹配上。

tools:
  # ── 监控指标：任务中心归为「查询监控」 ────────────────────────────
  - name: query_instant
    server: n9e-mcp
    backend: n9e
    description: 对监控数据源执行一次 PromQL 瞬时查询。
    produces: metric_series
    side_effect: read_only
    idempotent: true
    parallel_safe: true
    latency: fast

  - name: query_range
    server: n9e-mcp
    backend: n9e
    description: 对监控数据源执行 PromQL 区间查询，返回时间序列。
    produces: metric_series
    side_effect: read_only
    idempotent: true
    parallel_safe: true
    latency: medium

  # ── 告警：归为「查询事件」 ────────────────────────────────────────
  - name: list_active_alerts
    server: n9e-mcp
    backend: n9e
    description: 列出当前活跃告警。
    produces: events
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_history_alerts
    server: n9e-mcp
    backend: n9e
    description: 列出历史告警记录。
    produces: events
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  # ── 配置类：归为「读取配置」 ──────────────────────────────────────
  - name: list_alert_rules
    server: n9e-mcp
    backend: n9e
    description: 列出告警规则。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_busi_groups
    server: n9e-mcp
    backend: n9e
    description: 列出业务组。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_datasources
    server: n9e-mcp
    backend: n9e
    description: 列出监控数据源。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: list_dashboards
    server: n9e-mcp
    backend: n9e
    description: 列出监控大盘。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  - name: get_dashboard_pure
    server: n9e-mcp
    backend: n9e
    description: 读取单个大盘的完整配置。
    produces: config
    side_effect: read_only
    idempotent: true
    parallel_safe: true

  # ── 资源清单：归为「查询状态」 ────────────────────────────────────
  - name: list_targets
    server: n9e-mcp
    backend: n9e
    description: 列出被监控对象。
    produces: workload_status
    side_effect: read_only
    idempotent: true
    parallel_safe: true
